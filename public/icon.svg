<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="50%" stop-color="#047857" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="oil" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="60%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background circle with safe-zone margin -->
  <rect width="512" height="512" rx="128" fill="url(#bg)" />

  <!-- Outer gold ring -->
  <circle cx="256" cy="256" r="195" fill="none" stroke="#facc15" stroke-width="6" stroke-dasharray="16 8" opacity="0.6" />
  <circle cx="256" cy="256" r="180" fill="none" stroke="#34d399" stroke-width="4" opacity="0.8" />

  <!-- Mustard seed / oil drop -->
  <path d="M256 95 C256 95 335 210 335 285 C335 330 299 365 256 365 C213 365 177 330 177 285 C177 210 256 95 256 95 Z" fill="url(#oil)" filter="url(#shadow)" />

  <!-- Letter A for Arsh -->
  <text x="256" y="325" font-family="'Playfair Display', serif, Georgia" font-size="140" font-weight="900" fill="#064e3b" text-anchor="middle">A</text>

  <!-- ArshSarso subtitle -->
  <text x="256" y="420" font-family="'Plus Jakarta Sans', sans-serif" font-size="28" font-weight="800" fill="#fef08a" text-anchor="middle" letter-spacing="4">ARSHSARSO</text>
  <text x="256" y="450" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="600" fill="#a7f3d0" text-anchor="middle" letter-spacing="2">SIWAN • BIHAR</text>
</svg>
